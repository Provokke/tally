name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: CompeyDev/setup-rokit@v0.2.1
      - run: rokit install --no-trust-check
      - run: stylua --check src tests
      - run: selene src
      - run: cd tests && selene .
      - run: lune run tests/run
      - run: lune run tests/mutate
      - run: lune run tests/mutate -- --self-check
      - run: mkdir -p build && rojo build -o build/tally.rbxl
